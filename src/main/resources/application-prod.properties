spring.application.name=authService
# Render injects PORT and expects the app to bind to it; 8080 is just the local fallback.
server.port=${PORT:8080}

spring.config.import=optional:file:./.env[.properties]

# ---------- Cloud PostgreSQL (Neon) ----------
# Fill in DB_URL/DB_USERNAME/DB_PASSWORD via a local .env (gitignored, see .env.example)
# rather than editing the defaults below directly. Use Neon's *unpooled* connection
# string here, not the "-pooler" one: HikariCP already pools connections itself, and
# stacking it on top of Neon's PgBouncer (transaction-pooling mode) can break Hibernate's
# prepared-statement caching. sslmode=require is mandatory - Neon rejects plain TCP.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Neon's free tier caps concurrent connections fairly low - keep the pool small.
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.max-lifetime=600000

# ---------- JPA / Hibernate ----------
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# 'update' lets Hibernate create/alter tables from our @Entity classes while we are
# learning; switch to 'validate' and manage the schema with Flyway before going live.
#spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ---------- JWT ----------
# Must be byte-for-byte identical to petManagementService's prod jwt.secret — Core
# verifies tokens this service issues using the same shared HMAC secret.
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION}
